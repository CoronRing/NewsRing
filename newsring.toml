# NewsRing configuration. Every field is described in docs/configuration.md.

[profile]
name = "Guan"
interests = """
I build LLM agents and agent frameworks for a living, so I care most about:
- agent frameworks, tool calling, multi-agent orchestration, MCP, and agent harnesses
- evaluation of LLMs and agents: benchmarks, eval methodology, LLM-as-judge, and their failure modes
- new frontier and open-weight model releases, with what actually changed (context, price, benchmarks)
- inference engines and serving: vLLM, llama.cpp, Ollama, quantization, speculative decoding
- interpretability and safety research when it has practical consequences
- notable incidents: agents misbehaving in production, prompt injection, security issues
"""
avoid = """
Funding rounds and valuations, executive moves, AI policy op-eds without technical substance,
"AI will change everything" think pieces, crypto, and product marketing with no technical detail.
"""

[profile.count]
min = 5
max = 10
quick_hits = 6

[profile.tone]
detail = "standard"
style = "dry and lightly humorous, engineer to engineer; skeptical of hype, generous to good work"
language = "English"

[llm]
provider = "gemini"
model = "gemini-3.8-flash"
# Tried in order when the primary model is overloaded or rate limited on every key.
fallback_models = ["gemini-3.7-flash", "gemini-3.5-flash"]
# Several free-tier keys, comma separated or as a [list]; rate-limited keys are skipped.
api_key_env = "CHAT_GEMINI_API_KEYS"
rotation_cooldown = 30
# Four passes wait 30s, 60s and 120s between them, riding out a few minutes of overload.
rotation_rounds = 4

[run]
# Every run reads the last 3 days. Anything already sent in the last 14 days is
# dropped by URL, and the last 3 days of headlines are shown to the agents as
# already covered, so the same story from another source is skipped too.
lookback_hours = 72
history_days = 14
recent_days = 3
timezone = "America/Los_Angeles"
triage_threshold = 150
triage_keep = 80
enrich = true
save_traces = true

[headlines]
# The shareable card: the day's most exciting AI stories for anyone, not just me.
enabled = true
count = 3
window_hours = 72
audience = "developers and technically minded people who follow AI"
image = true

[delivery]
archive_dir = "news"
latest_markdown = "news_today.md"
site_dir = "site"
site_url = "https://coronring.github.io/NewsRing/"
site_title = "NewsRing"
project_url = "https://github.com/CoronRing/NewsRing"

[delivery.email]
# Needs `uv sync --extra email`, NEWSRING_EMAIL_TO (comma-separated list), and
# Emalia's mailbox variables (EMALIA_ADDRESS, EMALIA_PROVIDER, EMALIA_PASSWORD).
# Locally, `newsring run --no-email` skips it.
enabled = true

