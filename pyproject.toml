[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsring"
dynamic = ["version"]
description = "A daily news agent that reads the feeds you choose and writes you a digest in the tone you like"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Guan Zheng Huang" }]
maintainers = [{ name = "CoronRing" }]
keywords = ["news", "digest", "rss", "agent", "llm", "railtracks"]
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "railtracks>=1.5.7",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "tzdata>=2026.5",
]

[project.scripts]
newsring = "newsring.cli:main"

[project.optional-dependencies]
email = [
    "emalia>=0.2.0",
]

[tool.hatch.version]
path = "src/newsring/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/newsring"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: fetches real feeds (deselect with -m 'not network')",
    "llm: calls a real model, so it costs money (deselect with -m 'not llm')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# `rt.agent_node` returns a class, so PascalCase is correct for what it binds.
"src/newsring/agents.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
files = ["src/newsring"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
