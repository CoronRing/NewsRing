# Weekly update PRs for the workflow actions (including the SHA-pinned
# setup-uv) and the Python dependencies in uv.lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
