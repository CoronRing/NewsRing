# The daily run at 09:00 Pacific, in three jobs:
#   digest  produce the digest and the top stories card, commit news/ and
#           news_today.md back as history, and build the site
#   deploy  publish the site to GitHub Pages
#   email   send the digest, after deploy so its "read on the web" link works
# See docs/deployment.md for the secrets this needs.
name: Daily digest

on:
  schedule:
    # 09:00 Pacific, daylight saving handled by GitHub. Scheduled runs can
    # start late when GitHub is busy; one started 4.5 hours late in testing.
    - cron: "0 9 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Override the time window in hours. Empty uses the configured window (72)."
        required: false
      send_email:
        description: "Email the digest"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install
        run: uv sync --frozen

      - name: Produce digest
        env:
          CHAT_GEMINI_API_KEYS: ${{ secrets.CHAT_GEMINI_API_KEYS }}
          # Traces are throwaway on a CI runner.
          RAILTRACKS_DISABLE_EVENTS: "true"
          LOOKBACK: ${{ inputs.lookback_hours }}
        # The model failover rides out a few minutes of overload inside one
        # attempt; this outer loop covers a longer outage. Re-running is safe:
        # a run only writes files once it has finished.
        run: |
          for attempt in 1 2 3; do
            if uv run newsring run --no-email ${LOOKBACK:+--lookback-hours "$LOOKBACK"}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Attempt $attempt failed; retrying in 10 minutes."
              sleep 600
            fi
          done
          echo "::error::All 3 attempts failed."
          exit 1

      - name: Commit news
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news news_today.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "news: $(date -u +%F)"
            git pull --rebase --quiet
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: digest
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  email:
    needs: [digest, deploy]
    if: github.event_name == 'schedule' || inputs.send_email
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.digest.outputs.sha }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install
        run: uv sync --frozen --extra email

      - name: Send
        env:
          NEWSRING_EMAIL_TO: ${{ secrets.NEWSRING_EMAIL_TO }}
          EMALIA_ADDRESS: ${{ secrets.EMALIA_ADDRESS }}
          EMALIA_PROVIDER: ${{ vars.EMALIA_PROVIDER || 'gmail' }}
          EMALIA_PASSWORD: ${{ secrets.EMALIA_PASSWORD }}
        run: uv run newsring email
